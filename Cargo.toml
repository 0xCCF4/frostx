[package]
name = "frostx"
version = "0.1.0"
edition = "2021"
description = """frostx monitors project directories for inactivity. Once a configured inactivity threshold elapses (e.g. "90 days since any file was modified"), frostx executes a pipeline of **actions** - e.g., checking git state, creating archives, uploading backups, deleting local copies. Automating the lifecycle of projects, frostx helps users manage disk space and maintain a clean workspace."""
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["project", "lifecycle", "archive", "cleanup", "automation"]
homepage = "https://github.com/0xCCF4/frostx"
repository = "https://github.com/0xCCF4/frostx"
documentation = "https://docs.rs/frostx"

[[bin]]
name = "frostx"
path = "src/main.rs"

[[bin]]
name = "gen_man"
path = "src/bin/gen_man.rs"

[[bin]]
name = "gen_completions"
path = "src/bin/gen_completions.rs"

[dependencies]
anyhow       = "1"
chrono       = { version = "0.4", features = ["serde"] }
clap         = { version = "4", features = ["derive"] }
clap_complete= "4"
clap_mangen  = "0.3"
dialoguer    = "0.12"
directories  = "6"
flate2       = "1"
#indicatif   = "0.18"
owo-colors   = { version = "4", features = ["supports-colors"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tar          = "0.4"
thiserror    = "2"
toml         = "1"
uuid         = { version = "1", features = ["v4", "serde"] }
walkdir      = "2"
xz2          = "0.1"
zstd         = "0.13"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dev-dependencies]
tempfile    = "3"

[profile.release]
strip = true
lto   = true
